# ===================================================================
# Banking Management System - Application Configuration
# ===================================================================

spring.application.name=banking-management-system
server.port=8080

# ---------------- MySQL Datasource ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# Use 'update' for development. In real production, use migration tools like Flyway
# and set this to 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- JWT ----------------
# 256-bit secret used to sign JWTs. Override via environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- Logging ----------------
logging.level.org.springframework.security=INFO
logging.level.com.example.banking=DEBUG

# ---------------- Jackson ----------------
spring.jackson.default-property-inclusion=non_null
